name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  dotnet:
    name: .NET build + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore qType.slnx

      - name: Build
        run: dotnet build qType.slnx -c Release --no-restore

      - name: Unit tests
        run: dotnet test tests/QType.Tests/QType.Tests.csproj -c Release --no-build --verbosity normal

  sdk:
    name: SDK build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install
        working-directory: sdk
        run: npm ci

      - name: Build
        working-directory: sdk
        run: npm run build

  mcp:
    name: MCP build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install
        working-directory: mcp
        run: npm ci

      - name: Build
        working-directory: mcp
        run: npm run build
